<div id="vip-registrace-wrap" style="max-width:760px;margin:24px auto;padding:18px;background:#fff;border:1px solid #eee;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.06);font-family:Arial,Helvetica,sans-serif;color:#222;">
  <h1 style="margin:0 0 18px;font-size:28px;line-height:1.15;text-align:center;">VIP REGISTRACE</h1>
  <form id="vipRegistrationForm" novalidate>
    <div style="margin-bottom:14px;"><label for="vip_full_name" style="display:block;margin:0 0 6px;font-size:14px;font-weight:700;">Jméno a příjmení</label><input type="text" id="vip_full_name" name="full_name" required style="width:100%;padding:12px 14px;border:1px solid #dcdcdc;border-radius:10px;font-size:15px;outline:none;box-sizing:border-box;"></div>
    <div style="margin-bottom:14px;"><label for="vip_company" style="display:block;margin:0 0 6px;font-size:14px;font-weight:700;">Firma / Oddíl</label><input type="text" id="vip_company" name="company" required style="width:100%;padding:12px 14px;border:1px solid #dcdcdc;border-radius:10px;font-size:15px;outline:none;box-sizing:border-box;"></div>
    <div style="margin-bottom:14px;"><label for="vip_email" style="display:block;margin:0 0 6px;font-size:14px;font-weight:700;">E-mail</label><input type="email" id="vip_email" name="email" required style="width:100%;padding:12px 14px;border:1px solid #dcdcdc;border-radius:10px;font-size:15px;outline:none;box-sizing:border-box;"></div>
    <button type="submit" id="vipSubmitBtn" style="width:100%;padding:13px 16px;border:0;border-radius:10px;background:#4caf50;color:#fff;font-size:16px;font-weight:700;cursor:pointer;">Odeslat</button>
    <div id="vipFormMsg" style="display:none;margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.45;"></div>
    <div style="margin-top:10px;font-size:12px;color:#666;text-align:center;">Po odeslání vám účet aktivujeme do 24 hodin.</div>
  </form>
</div>
<script>
(function(){var form=document.getElementById('vipRegistrationForm');var btn=document.getElementById('vipSubmitBtn');var msg=document.getElementById('vipFormMsg');function showMsg(type,text){msg.style.display='block';msg.textContent=text;if(type==='ok'){msg.style.background='#eefaf0';msg.style.border='1px solid #b7e0bd';msg.style.color='#166534';}else{msg.style.background='#fff2f2';msg.style.border='1px solid #f0c7c7';msg.style.color='#b42318';}}
form.addEventListener('submit',async function(e){e.preventDefault();var fullName=(document.getElementById('vip_full_name').value||'').trim();var company=(document.getElementById('vip_company').value||'').trim();var email=(document.getElementById('vip_email').value||'').trim();if(!fullName||!company||!email){showMsg('err','Vyplňte prosím všechna pole.');return;}var emailOk=/^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(email);if(!emailOk){showMsg('err','Zadejte prosím platný e-mail.');return;}btn.disabled=true;btn.style.opacity='0.65';showMsg('ok','Odesílám...');try{var body=new URLSearchParams();body.append('full_name',fullName);body.append('company',company);body.append('email',email);var res=await fetch('https://cfloat.cz/VIP/api/submit.php',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded; charset=UTF-8'},body:body.toString()});var data=await res.json();if(!res.ok||!data.success){throw new Error(data.message||'Formulář se nepodařilo odeslat.');}form.innerHTML='<div style="display:block;background:#eefaf0;border:1px solid #b7e0bd;color:#166534;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.45;">Děkujeme. Váš účet bude aktivní do 24 hodin. Do emailu Vám přijde odkaz na vytvoření hesla.</div>';}catch(err){showMsg('err',err&&err.message?err.message:'Formulář se nepodařilo odeslat.');btn.disabled=false;btn.style.opacity='1';}});
})();
</script>
