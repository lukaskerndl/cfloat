name: Nasazeni na Wedos (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Stahnout kod
        uses: actions/checkout@v4

      - name: Kontrola PHP syntaxe
        run: |
          find . -name "*.php" -not -path "./.git/*" -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Nahrat na FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /www/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/secrets/**
            **/tmp/**
            **/tmp_uploads/**
            **/feed-archive/**
            **/tmp-feed/**
            **/cache/**
            **/*.log
